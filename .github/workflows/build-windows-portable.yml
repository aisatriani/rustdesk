
name: RustDesk Windows x64 Portable

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: "Artifact version label"
        required: true
        default: "custom"

permissions:
  contents: read

env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:

  # Generate Flutter Rust Bridge on Linux
  generate-bridge:
    name: Generate Flutter Rust Bridge
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc git g++ \
            libclang-dev libgtk-3-dev llvm-dev \
            nasm ninja-build pkg-config wget

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.22.3"

      - name: Install bridge generator
        run: |
          cargo install cargo-expand --version 1.0.95 --locked
          cargo install flutter_rust_bridge_codegen \
            --version 1.80.1 \
            --features uuid \
            --locked

      - name: Generate bridge
        shell: bash
        run: |
          sed -i 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml

          cd flutter
          flutter pub get
          cd ..

          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

          cp ./flutter/macos/Runner/bridge_generated.h \
             ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge
        uses: actions/upload-artifact@v4
        with:
          name: bridge-artifact
          path: |
            src/bridge_generated.rs
            src/bridge_generated.io.rs
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h
          if-no-files-found: error

  # Build Windows helper DLL
  build-topmost:
    name: Build TopMostWindow DLL
    runs-on: windows-2022

    steps:
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Checkout helper source
        run: |
          git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow
          cd RustDeskTempTopMostWindow
          git checkout ecd8d6a139eee76845ea66423fb739af450fda90

      - name: Build DLL
        run: |
          cd RustDeskTempTopMostWindow
          msbuild WindowInjection/WindowInjection.vcxproj `
            -p:Configuration=Release `
            -p:Platform=x64 `
            /p:TargetVersion=Windows10

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: RustDeskTempTopMostWindow/WindowInjection/x64/Release/WindowInjection.dll
          if-no-files-found: error

  # Main Windows build
  build-windows:
    name: Build RustDesk Windows x64
    runs-on: windows-2022
    needs:
      - generate-bridge
      - build-topmost

    timeout-minutes: 240

    env:
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static

    steps:
      - name: Export GitHub Actions cache environment
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download bridge
        uses: actions/download-artifact@v4
        with:
          name: bridge-artifact
          path: ./

      - name: Download TopMostWindow DLL
        uses: actions/download-artifact@v4
        with:
          name: topmostwindow-artifacts-x64
          path: ./rustdesk/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Prepare Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows

          Invoke-WebRequest `
            -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip `
            -OutFile windows-x64-release.zip

          Expand-Archive windows-x64-release.zip -DestinationPath windows-x64-release

          $flutterRoot = Split-Path (Split-Path (Get-Command flutter).Source)

          Copy-Item `
            -Path "windows-x64-release\*" `
            -Destination "$flutterRoot\bin\cache\artifacts\engine\windows-x64-release\" `
            -Recurse -Force

      - name: Patch Flutter
        shell: bash
        run: |
          PATCH_FILE="$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

          test -f "$PATCH_FILE"

          FLUTTER_ROOT="$(dirname "$(dirname "$(which flutter)")")"
          cp "$PATCH_FILE" "$FLUTTER_ROOT/"

          cd "$FLUTTER_ROOT"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.75"
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: windows-x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install native dependencies
        shell: bash
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then

            find "$VCPKG_ROOT/" -name "*.log" -print -exec cat {} \;
            exit 1
          fi

      - name: Build RustDesk
        shell: pwsh
        run: |
          python build.py --portable --flutter --skip-portable-pack --hwcodec --vram

          $release = "./flutter/build/windows/x64/runner/Release"

          if (!(Test-Path "$release/rustdesk.exe")) {
            throw "RustDesk executable was not generated."
          }

          New-Item -ItemType Directory -Force -Path "./rustdesk"

          Copy-Item "$release/*" "./rustdesk/" -Recurse -Force

      - name: Build portable executable
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml

          cd libs/portable

          python -m pip install -r requirements.txt

          python ./generate.py \
            -f ../../rustdesk/ \
            -o . \
            -e ../../rustdesk/rustdesk.exe

          cd ../..

          mkdir -p SignOutput

          cp target/release/rustdesk-portable-packer.exe \
            SignOutput/rustdesk-windows-x64-portable.exe

      - name: Verify output
        shell: pwsh
        run: |
          $file = "./SignOutput/rustdesk-windows-x64-portable.exe"

          if (!(Test-Path $file)) {
            throw "Portable executable not found."
          }

          Get-FileHash $file -Algorithm SHA256

      - name: Upload portable executable
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-x64-portable-${{ inputs.build_version }}
          path: SignOutput/rustdesk-windows-x64-portable.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
